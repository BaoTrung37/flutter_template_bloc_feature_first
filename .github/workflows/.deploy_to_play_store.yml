name: 🤖 Android Internal Release

on:
  push:
    tags:
      - "android-dev*"
      - "android-prod*"
      - "v*"

concurrency:
  group: android-internal-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_context:
    name: 🧭 Detect Build Context
    runs-on: ubuntu-latest
    outputs:
      app_env: ${{ steps.detect.outputs.app_env }}
    steps:
      - name: 🧩 Resolve environment
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$REF_NAME" == dev* || "$REF_NAME" == android-dev* ]]; then
            APP_ENV="dev"
          else
            APP_ENV="prod"
          fi

          {
            echo "app_env=$APP_ENV"
          } >> "$GITHUB_OUTPUT"

          echo "Tag: $REF_NAME"
          echo "Environment: $APP_ENV"

  build_and_upload:
    name: 🚀 Build and Upload to Play Internal
    needs: detect_context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # TODO: enable this when we have separate environments for dev and prod
    # environment: ${{ needs.detect_context.outputs.app_env }}
    env:
      APP_ENV: ${{ needs.detect_context.outputs.app_env }}
      PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
      FLUTTER_VERSION: 3.35.2 # TODO: update this version

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ✅ Preflight checks (required secrets)
        shell: bash
        env:
          ENV_BASE64: ${{ secrets.ENV_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ENV_BASE64:?Missing secret ENV_BASE64}"
          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_PASSWORD:?Missing secret ANDROID_KEY_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing secret ANDROID_KEY_ALIAS}"
          : "${PLAY_STORE_JSON:?Missing secret PLAY_STORE_JSON}"
          : "${PACKAGE_NAME:?Missing variable ANDROID_PACKAGE_NAME}"

      - name: ⚡ Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: ⚡ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: 🦋 Show Flutter version
        shell: bash
        run: flutter --version

      - name: 🔐 Decode environment file(s)
        shell: bash
        env:
          ENV_BASE64: ${{ secrets.ENV_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p assets/environments
          echo "$ENV_BASE64" | base64 --decode | tr -d '\r' > assets/environments/.env.dev
          echo "$ENV_BASE64" | base64 --decode | tr -d '\r' > assets/environments/.env
          ls -la assets/environments/

      - name: 📦 Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter gen-l10n --no-nullable-getter

      - name: 🔐 Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload_keystore.jks
          ls -la android/app/upload_keystore.jks
          file android/app/upload_keystore.jks

      - name: 🔐 Generate android/key.properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          printf "storePassword=%s\n" "${ANDROID_KEYSTORE_PASSWORD}" > android/key.properties
          printf "keyPassword=%s\n" "${ANDROID_KEY_PASSWORD}" >> android/key.properties
          printf "keyAlias=%s\n" "${ANDROID_KEY_ALIAS}" >> android/key.properties
          printf "storeFile=%s\n" "$(pwd)/android/app/upload_keystore.jks" >> android/key.properties

          ls -la android/key.properties
          file android/key.properties

      - name: 🔍 Validate Android signing credentials
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$(pwd)/android/app/upload_keystore.jks"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null \
            || {
              echo "Invalid ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS (or wrong ANDROID_KEYSTORE_BASE64 keystore file)."
              exit 1
            }

          keytool -certreq \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1 \
            || {
              echo "Invalid ANDROID_KEY_PASSWORD for alias: $ANDROID_KEY_ALIAS"
              exit 1
            }

          echo "Android keystore credentials validated for alias: $ANDROID_KEY_ALIAS"

      - name: 🏗 Build AAB
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          flutter build appbundle \
            --flavor "$APP_ENV" \
            --release \
            --no-tree-shake-icons \
            -t lib/main.dart \
            --dart-define=FLAVOR="$APP_ENV"

      - name: 🔐 Decode Google Play service account JSON
        shell: bash
        env:
          PLAY_STORE_JSON: ${{ secrets.PLAY_STORE_JSON }}
        run: |
          set -euo pipefail
          echo "$PLAY_STORE_JSON" | base64 --decode > google_play.json

      - name: 🚀 Upload AAB to Google Play Internal
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: google_play.json
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/${{ env.APP_ENV }}Release/app-${{ env.APP_ENV }}-release.aab
          track: internal
          status: draft
